<!doctype html>
<!-- Modelled on a real ClickUp full-page task (2026-11): task header breadcrumbs "Space › Folder › List" inside the task container; the page breadcrumbs skip the Folder. -->
<html>
<head><meta charset="utf-8"><title>Fix checkout total | #86c1fffff</title></head>
<body class="cu-v3">
  <cu-breadcrumb>
    <cu-breadcrumb-item><span class="avatar-initials">S</span><span>Clients</span></cu-breadcrumb-item>
    <cu-breadcrumb-item><span>Bugs</span></cu-breadcrumb-item>
  </cu-breadcrumb>
  <div class="cu-task-view__container">
    <cu-task-view-header data-test="task-container__header-wrapper">
      <div class="cu-task-view-header__left">
        <cu-task-view-breadcrumbs data-test="task-view-header__breadcrumbs" class="cu-task-view-header__breadcrumbs">
          <a class="cu-task-view-breadcrumbs__v4morelists"><span class="cu-task-view-breadcrumbs__v4morelists__name">Clients</span></a>
          <a class="cu-task-view-breadcrumbs__v4morelists"><span class="cu-task-view-breadcrumbs__v4morelists__name">Acme</span></a>
          <a data-test="task-view-breadcrumbs__timl-list-item" class="cu-task-view-breadcrumbs__v4morelists"><span class="cu-task-view-breadcrumbs__v4morelists__name">Bugs</span></a>
        </cu-task-view-breadcrumbs>
      </div>
    </cu-task-view-header>
    <cu-task-hero-section>
      <div data-test="task-title__container"><h1 class="cu-task-title__overlay">Fix checkout total</h1></div>
    </cu-task-hero-section>
  </div>
</body>
</html>
